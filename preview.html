                  href="#contact"
                  className="block w-full py-2.5 bg-[#0F382C] hover:bg-[#1B5342] text-white text-center font-bold text-xs rounded"
                >
                  {isEnglish ? `Call Helpline: ${BRAND.mobile}` : `నేరుగా సంప్రదించండి: ${BRAND.mobile}`}
                </a>
              </div>

            </div>
          </section>

          {/* Calculator Section */}
          <section id="calculator" className="py-16 px-4 sm:px-8 max-w-[1360px] mx-auto border-t border-gray-200 dark:border-white/10">
            <div className="text-center max-w-2xl mx-auto mb-10">
              <h2 className="text-3xl font-extrabold font-serif text-[#0F382C] dark:text-white mb-2">
                చిట్ & డివిడెండ్ క్యాలిక్యులేటర్
              </h2>
              <p className="text-sm text-gray-600 dark:text-gray-300">
                చిట్ మొత్తం మరియు నెలల ఆధారంగా వాయిదా మరియు డివిడెండ్ లెక్కింపు:
              </p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
              <div className="lg:col-span-6 bg-white dark:bg-[#08221A] p-6 sm:p-8 rounded border border-[#B88E38]/40 shadow-sm space-y-6">
                <div>
                  <label className="text-xs font-bold text-[#0F382C] dark:text-[#D4AF57] block mb-2">చిట్ మొత్తం ఎంచుకోండి:</label>
                  <div className="grid grid-cols-3 gap-2">
                    {[100000, 250000, 500000, 1000000, 2500000].map(v => (
                      <button
                        key={v}
                        onClick={() => setCalcValue(v)}
                        className={`py-2 text-xs font-bold rounded border ${calcValue === v ? 'bg-[#0F382C] text-white' : 'bg-gray-50 dark:bg-white/5'}`}
                      >
                        {formatINR(v)}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <div className="flex justify-between text-sm font-bold mb-1">
                    <span>చిట్ విలువ:</span>
                    <span className="text-[#0F382C] dark:text-[#D4AF57] text-lg font-bold">{formatINR(calcValue)}</span>
                  </div>
                  <input
                    type="range"
                    min="50000"
                    max="2500000"
                    step="25000"
                    value={calcValue}
                    onChange={(e) => setCalcValue(Number(e.target.value))}
                    className="w-full accent-[#0F382C]"
                  />
                </div>

                <div>
                  <label className="text-xs font-bold text-[#0F382C] dark:text-[#D4AF57] block mb-2">వ్యవధి (నెలలు):</label>
                  <div className="grid grid-cols-4 gap-2">
                    {[25, 30, 40, 50].map(t => (
                      <button
                        key={t}
                        onClick={() => setCalcTenure(t)}
                        className={`py-2 text-xs font-bold rounded border ${calcTenure === t ? 'bg-[#0F382C] text-white' : 'bg-gray-50 dark:bg-white/5'}`}
                      >
                        {t} నెలలు
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {/* Calculated Results */}
              <div className="lg:col-span-6 bg-white dark:bg-[#08221A] p-6 sm:p-8 rounded border-2 border-[#B88E38]/60 shadow-md space-y-4">
                <h3 className="font-serif text-xl font-bold text-[#0F382C] dark:text-white border-b pb-2">
                  అంచనా ఫలితాల పట్టిక
                </h3>

                <div className="grid grid-cols-2 gap-4">
                  <div className="p-3 bg-gray-50 dark:bg-white/5 rounded">
                    <span className="text-xs text-gray-500 block">అసలు వాయిదా:</span>
                    <span className="text-xl font-bold">{formatINR(grossMonthly)}</span>
                  </div>
                  <div className="p-3 bg-[#EBF3F0] dark:bg-white/10 rounded">
                    <span className="text-xs text-[#0F382C] font-bold block">నెట్ సగటు వాయిదా:</span>
                    <span className="text-xl font-bold text-[#0F382C] dark:text-[#D4AF57]">{formatINR(netMonthly)}</span>
                  </div>
                  <div className="p-3 bg-[#FFF8EE] rounded">
                    <span className="text-xs text-[#8C671C] font-bold block">మొత్తం డివిడెండ్ బోనస్:</span>
                    <span className="text-xl font-bold text-[#8C671C]">~ {formatINR(totalDividend)}</span>
                  </div>
                  <div className="p-3 bg-gray-50 dark:bg-white/5 rounded">
                    <span className="text-xs text-[#C05621] font-bold block">తక్షణ వేలం నిధులు:</span>
                    <span className="text-xl font-bold text-[#C05621]">{formatINR(calcValue * 0.70)}</span>
                  </div>
                </div>

                <a
                  href="#contact"
                  className="block w-full py-3 bg-[#0F382C] hover:bg-[#1B5342] text-white text-center font-bold text-sm rounded mt-4"
                >
                  ఈ ప్లాన్ ({formatINR(calcValue)}) కోసం నమోదు చేసుకోండి →
                </a>
              </div>
            </div>
          </section>

          {/* Schemes Section */}
          <section id="schemes" className="py-16 px-4 sm:px-8 max-w-[1360px] mx-auto border-t border-gray-200 dark:border-white/10">
            <div className="text-center max-w-2xl mx-auto mb-10">
              <h2 className="text-3xl font-extrabold font-serif text-[#0F382C] dark:text-white mb-2">
                ప్రస్తుతం అందుబాటులో ఉన్న చిట్ పథకాలు
              </h2>
              <p className="text-sm text-gray-600 dark:text-gray-300">
                మీ బడ్జెట్‌కు తగిన గ్రూప్‌ను ఎంచుకోండి:
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {CHIT_SCHEMES.map(s => (
                <div key={s.id} className="bg-white dark:bg-[#08221A] border border-[#B88E38]/40 rounded p-6 shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
                  <div>
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-xs font-bold text-[#C05621]">{s.badge}</span>
                    </div>
                    <h3 className="font-serif text-lg font-bold text-[#0F382C] dark:text-white">{s.name}</h3>
                    <div className="text-3xl font-extrabold text-[#0F382C] dark:text-[#D4AF57] my-2">{s.value}</div>
                    
                    <div className="space-y-1.5 text-xs text-gray-600 dark:text-gray-300 py-3 border-y border-gray-100 dark:border-white/10">
                      <div className="flex justify-between"><span>వాయిదా:</span><span className="font-bold text-gray-900 dark:text-white">{s.monthly}</span></div>
                      <div className="flex justify-between"><span>వ్యవధి:</span><span className="font-bold">{s.tenure}</span></div>
                      <div className="flex justify-between"><span>డివిడెండ్:</span><span className="font-bold text-[#8C671C]">{s.dividend}</span></div>
                    </div>
                    <div className="text-xs text-gray-500 my-3 bg-gray-50 dark:bg-white/5 p-2 rounded">
                      <strong>అనుకూలం:</strong> {s.target}
                    </div>
                  </div>

                  <a
                    href="#contact"
                    className="block w-full py-2 bg-[#0F382C] hover:bg-[#1B5342] text-white text-center text-xs font-bold rounded"
                  >
                    ఈ గ్రూప్‌లో చేరండి →
                  </a>
                </div>
              ))}
            </div>
          </section>

          {/* Contact / Inquiry */}
          <section id="contact" className="py-16 px-4 sm:px-8 max-w-[1360px] mx-auto border-t border-gray-200 dark:border-white/10">
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
              
              <div className="lg:col-span-6 space-y-4">
                <h2 className="text-2xl font-serif font-extrabold text-[#0F382C] dark:text-white">
                  ఏలూరు బ్రాంచ్ కార్యాలయం
                </h2>
                <p className="text-xs sm:text-sm text-gray-600 dark:text-gray-300">
                  {BRAND.address}
                </p>
                <div className="space-y-2 text-xs font-semibold">
                  <div>📞 ఫోన్: {BRAND.phone}</div>
                  <div>📱 మొబైల్: {BRAND.mobile}</div>
                  <div>⏰ పని వేళలు: {BRAND.workingHours}</div>
                </div>
              </div>

              <div className="lg:col-span-6 bg-white dark:bg-[#08221A] p-6 rounded border-2 border-[#B88E38]/50 shadow-md">
                <h3 className="font-serif text-lg font-bold text-[#0F382C] dark:text-white mb-3">
                  సభ్యత్వ విచారణ ఫారం
                </h3>
                {formSubmitted ? (
                  <div className="p-4 bg-[#EBF3F0] rounded text-center text-xs text-[#0F382C] font-bold">
                    ధన్యవాదాలు! మీ విచారణ అందింది. మా ఏలూరు బ్రాంచ్ ప్రతినిధి వెంటనే సంప్రదిస్తారు.
                  </div>
                ) : (
                  <form onSubmit={(e) => { e.preventDefault(); setFormSubmitted(true); }} className="space-y-3 text-xs">
                    <div>
                      <label className="font-bold block mb-1">మీ పేరు:</label>
                      <input required type="text" placeholder="పూర్తి పేరు" className="w-full p-2 border rounded" />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">మొబైల్ నంబర్:</label>
                      <input required type="tel" placeholder="9876543210" className="w-full p-2 border rounded" />
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-[#0F382C] text-white font-bold rounded">
                      కాల్ బ్యాక్ అభ్యర్థించండి →
                    </button>
                  </form>
                )}
              </div>

            </div>
          </section>

          {/* Footer */}
          <footer className="bg-[#08221A] text-white text-xs py-8 px-4 text-center border-t-2 border-[#B88E38]">
            <div className="max-w-[1360px] mx-auto space-y-2">
              <div className="font-serif text-base font-bold">{BRAND.nameTelugu} ప్రై.లి. • {BRAND.regionTelugu}</div>
              <div className="text-gray-300">ఆంధ్రప్రదేశ్ చిట్ ఫండ్స్ చట్టం 1982 కింద 100% ప్రభుత్వ రిజిస్టర్డ్ సంస్థ (Reg: {BRAND.registrationNumber})</div>
              <div className="text-gray-400 pt-2">© {new Date().getFullYear()} SIVA KAVERI CHITS RBT. All Rights Reserved.</div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
